name: Build JEE Tracker Android APK + Firebase SHA-1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply native Android widgets
        run: |
          if [ -f native-android/apply-widgets.py ]; then
            python3 native-android/apply-widgets.py
          fi

      - name: Configure Firebase
        run: |
          if [ -f firebase/google-services.json ]; then
            mkdir -p android/app
            cp firebase/google-services.json android/app/google-services.json
            echo "Firebase google-services.json found."
          else
            echo "No google-services.json yet. Continuing without native Firebase config."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Firebase SHA-1
        working-directory: android
        run: |
          chmod +x gradlew

          echo "Generating Android signing report..."
          ./gradlew signingReport --no-daemon 2>&1 | tee signing-report.txt

          SHA1=$(grep -m 1 "SHA1:" signing-report.txt | sed 's/.*SHA1:[[:space:]]*//')

          if [ -z "$SHA1" ]; then
            echo "ERROR: SHA-1 could not be extracted."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "FIREBASE SHA-1"
          echo "$SHA1"
          echo "=========================================="

          mkdir -p ../firebase
          printf '%s\n' "$SHA1" > ../firebase/firebase-debug-sha1.txt

          {
            echo "## Firebase SHA-1"
            echo ""
            echo '```text'
            echo "$SHA1"
            echo '```'
            echo ""
            echo "Add this SHA-1 to Firebase → Project settings → Your apps → JEE Tracker → SHA certificate fingerprints."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Firebase SHA-1
        uses: actions/upload-artifact@v4
        with:
          name: firebase-debug-sha1
          path: firebase/firebase-debug-sha1.txt

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Generate APK SHA-256
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk \
            > app-debug.apk.sha256

      - name: Upload APK
