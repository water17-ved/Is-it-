name: Build JEE Tracker Android APK + Firebase SHA-1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Firebase SHA-1
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew signingReport --no-daemon 2>&1 | tee signing-report.txt

          SHA1=$(grep -m 1 "SHA1:" signing-report.txt | sed 's/.*SHA1:[[:space:]]*//')

          echo "=========================================="
          echo "FIREBASE SHA-1"
          echo "$SHA1"
          echo "=========================================="

          mkdir -p ../firebase
          echo "$SHA1" > ../firebase/firebase-debug-sha1.txt

          {
            echo "## 🔥 Firebase SHA-1"
            echo ""
            echo '```text'
            echo "$SHA1"
            echo '```'
            echo ""
            echo "Add this SHA-1 to Firebase → Project settings → Your apps → JEE Tracker → SHA certificate fingerprints."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Firebase SHA-1
        uses: actions/upload-artifact@v4
        with:
          name: firebase-debug-sha1
          path: firebase/firebase-debug-sha1.txt

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Generate APK SHA-256
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Tracker-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
