name: Build JEE Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install npm dependencies
        run: npm install

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Apply native widgets
        run: |
          if [ -f native-android/apply-widgets.py ]; then
            python3 native-android/apply-widgets.py
          fi

      - name: Configure Firebase
        run: |
          if [ -f firebase/google-services.json ]; then
            mkdir -p android/app
            cp firebase/google-services.json android/app/google-services.json
            echo "Firebase configuration found."
          else
            echo "Firebase configuration not found. Continuing."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Firebase SHA-1
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew signingReport --no-daemon 2>&1 | tee signing-report.txt

          SHA1=$(grep -m 1 "SHA1:" signing-report.txt | sed 's/.*SHA1:[[:space:]]*//')

          if [ -z "$SHA1" ]; then
            echo "ERROR: SHA-1 was not found."
            cat signing-report.txt
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "FIREBASE SHA-1"
          echo "$SHA1"
          echo "========================================"

          mkdir -p ../firebase
          echo "$SHA1" > ../firebase/firebase-debug-sha1.txt

          echo "## Firebase SHA-1" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$SHA1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Firebase SHA-1
        uses: actions/upload-artifact@v4
        with:
          name: firebase-debug-sha1
          path: firebase/firebase-debug-sha1.txt

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Generate APK SHA-256
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Tracker-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
