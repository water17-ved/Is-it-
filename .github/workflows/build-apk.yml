name: Build JEE Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  CAPACITOR_VERSION: '7.4.3'

jobs:
  build:
    name: Build debug APK + Firebase SHA-1
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. NODE
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 3. JAVA
      #
      # IMPORTANT:
      # No "cache: gradle" here.
      #
      # Android/Gradle does not exist yet at this point.
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache-jdk: true


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 5. VERIFY SOURCE
      # ============================================================

      - name: Inspect repository
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Repository contents"
          echo "======================================"

          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200

          echo
          echo "======================================"
          echo "Checking JEE Tracker source"
          echo "======================================"

          if [ -f index.html ]; then
            echo "✓ index.html found"
          elif [ -f www/index.html ]; then
            echo "✓ www/index.html found"
          else
            echo "ERROR: index.html was not found."
            echo
            echo "The JEE Tracker web files must be pushed to the repository."
            exit 1
          fi


      # ============================================================
      # 6. PREPARE WEB DIRECTORY
      # ============================================================

      - name: Prepare web directory
        shell: bash
        run: |
          set -e

          mkdir -p www

          if [ -f index.html ]; then
            echo "Copying root web files into www/"

            cp index.html www/

            for f in \
              schedule.html \
              test-analysis.html \
              manifest.json \
              sw.js \
              ai-file-reader.js \
              jee-ai-android.js \
              jee-android-hardening.js \
              jee-android-native.js \
              jee-capacitor-bridge.js \
              jee-native-files.js \
              jee-native-storage.js \
              jee-network-status.js \
              jee-widgets.js \
              icon-192.png \
              icon-512.png
            do
              if [ -f "$f" ]; then
                cp "$f" www/
                echo "Copied: $f"
              fi
            done
          fi

          test -f www/index.html

          echo
          echo "Web directory ready."

          ls -lah www/


      # ============================================================
      # 7. CREATE PACKAGE.JSON IF REQUIRED
      # ============================================================

      - name: Prepare package.json
        shell: bash
        run: |
          set -e

          if [ -f package.json ]; then
            echo "Existing package.json found."
            exit 0
          fi

          echo "Creating Capacitor package.json..."

          cat > package.json <<'JSON'
          {
            "name": "jee-tracker-android",
            "version": "1.0.0",
            "private": true,
            "description": "JEE Tracker Android application",
            "scripts": {
              "android:add": "cap add android",
              "android:sync": "cap sync android",
              "android:build": "cd android && ./gradlew assembleDebug"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/app": "^7.1.0",
              "@capacitor/filesystem": "^7.1.0",
              "@capacitor/local-notifications": "^7.0.7",
              "@capacitor/share": "^7.0.0",
              "@capawesome/capacitor-file-picker": "^7.2.0",
              "@capacitor-firebase/authentication": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "typescript": "^5.8.3"
            }
          }
          JSON

          echo "package.json created."


      # ============================================================
      # 8. CAPACITOR CONFIG
      # ============================================================

      - name: Prepare Capacitor configuration
        shell: bash
        run: |
          set -e

          if [ -f capacitor.config.ts ]; then
            echo "Existing capacitor.config.ts found."
            exit 0
          fi

          cat > capacitor.config.ts <<'TS'
          import type { CapacitorConfig } from '@capacitor/cli';

          const enableNativeGoogle =
            process.env.JEE_NATIVE_GOOGLE_AUTH === '1';

          const config: CapacitorConfig = {
            appId: 'com.vedplayer.jeetracker',
            appName: 'JEE Tracker',
            webDir: 'www',
            bundledWebRuntime: false,

            plugins: {
              FirebaseAuthentication: {
                skipNativeAuth: false,
                providers: enableNativeGoogle
                  ? ['google.com']
                  : []
              }
            },

            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          TS

          echo "capacitor.config.ts created."


      # ============================================================
      # 9. VERIFY BUILD INPUTS
      # ============================================================

      - name: Verify build inputs
        shell: bash
        run: |
          set -e

          echo "Checking required files..."

          test -f package.json
          test -f capacitor.config.ts
          test -f www/index.html

          echo "✓ package.json"
          echo "✓ capacitor.config.ts"
          echo "✓ www/index.html"

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Java:"
          java -version


      # ============================================================
      # 10. INSTALL NPM DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        run: |
          npm install --no-audit --no-fund


      # ============================================================
      # 11. OPTIONAL FIREBASE CONFIGURATION
      # ============================================================

      - name: Detect Firebase configuration
        shell: bash
        run: |
          if [ -f firebase/google-services.json ]; then
            echo "JEE_NATIVE_GOOGLE_AUTH=1" >> "$GITHUB_ENV"
            echo "✓ Firebase google-services.json found."
          else
            echo "JEE_NATIVE_GOOGLE_AUTH=0" >> "$GITHUB_ENV"
            echo "Firebase configuration not supplied yet."
          fi


      # ============================================================
      # 12. CREATE ANDROID PROJECT
      # ============================================================

      - name: Add Capacitor Android
        run: |
          npx cap add android


      # ============================================================
      # 13. APPLY JEE TRACKER WIDGETS
      # ============================================================

      - name: Apply native widgets
        shell: bash
        run: |
          if [ -f native-android/apply-widgets.py ]; then
            echo "Applying JEE Tracker widgets..."
            python3 native-android/apply-widgets.py
            echo "✓ Widgets applied."
          else
            echo "No widget overlay found."
          fi


      # ============================================================
      # 14. FIREBASE ANDROID CONFIG
      # ============================================================

      - name: Configure Firebase Android
        shell: bash
        run: |
          set -e

          if [ ! -f firebase/google-services.json ]; then
            echo "No Firebase configuration supplied."
            echo "Continuing without native Google Sign-In."
            exit 0
          fi

          mkdir -p android/app

          cp firebase/google-services.json \
             android/app/google-services.json

          echo "✓ google-services.json copied."


      # ============================================================
      # 15. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ============================================================
      # 16. GENERATE FIREBASE SHA-1
      # ============================================================

      - name: Generate Firebase SHA-1
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew signingReport \
            --no-daemon \
            > ../signing-report.txt 2>&1

          cd ..

          echo
          echo "======================================"
          echo "FIREBASE SHA-1"
          echo "======================================"

          grep -E "SHA1:|SHA-1:" \
            signing-report.txt || true

          SHA1="$(
            grep -E "SHA1:|SHA-1:" signing-report.txt \
            | head -n 1 \
            | sed -E 's/.*(SHA1:|SHA-1:) *//'
          )"

          if [ -z "$SHA1" ]; then
            echo
            echo "ERROR: SHA-1 could not be extracted."
            echo
            cat signing-report.txt
            exit 1
          fi

          echo "$SHA1" > firebase-debug-sha1.txt

          echo
          echo "SHA-1:"
          echo "$SHA1"

          {
            echo "## Firebase Debug SHA-1"
            echo
            echo "\`$SHA1\`"
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 17. BUILD APK
      # ============================================================

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 18. APK SHA-256
      # ============================================================

      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -e

          sha256sum \
            android/app/build/outputs/apk/debug/app-debug.apk \
            > app-debug.apk.sha256

          echo "APK SHA-256:"
          cat app-debug.apk.sha256


      # ============================================================
      # 19. UPLOAD FIREBASE SHA-1
      # ============================================================

      - name: Upload Firebase SHA-1
        uses: actions/upload-artifact@v4
        with:
          name: jee-tracker-firebase-debug-sha1
          path: |
            firebase-debug-sha1.txt
            signing-report.txt
          if-no-files-found: error


      # ============================================================
      # 20. UPLOAD APK
      # ============================================================

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jee-tracker-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
