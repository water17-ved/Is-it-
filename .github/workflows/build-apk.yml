name: JEE Tracker Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract JEE Tracker ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            -iname 'JEE-Tracker-Android-*.zip' \
            | sort | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: JEE Tracker ZIP not found."
            exit 1
          fi

          echo "Using: $ZIP"

          mkdir -p .jee-extracted
          unzip -q "$ZIP" -d .jee-extracted

          ROOT=$(find .jee-extracted -type f \
            -name index.html -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: index.html not found inside ZIP."
            exit 1
          fi

          cp -R "$ROOT"/. .

          echo "JEE Tracker extracted successfully."

      - name: Verify project
        run: |
          test -f index.html
          test -f schedule.html
          test -f test-analysis.html
          test -f package.json

          echo "Project verified."

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare web directory
        run: |
          mkdir -p www
          cp index.html schedule.html test-analysis.html www/

          find . -maxdepth 1 -type f \
            \( -name '*.js' -o -name '*.json' -o -name '*.png' \) \
            -exec cp {} www/ \; || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android
        run: npx cap add android

      - name: Apply widgets
        run: |
          if [ -f native-android/apply-widgets.py ]; then
            python3 native-android/apply-widgets.py
          fi

      - name: Firebase
        run: |
          if [ -f firebase/google-services.json ]; then
            mkdir -p android/app
            cp firebase/google-services.json android/app/
          fi

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Get Firebase SHA-1
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | grep "SHA1:" \
            > firebase-debug-sha1.txt

          cat firebase-debug-sha1.txt

      - name: APK SHA-256
        run: |
          sha256sum \
            android/app/build/outputs/apk/debug/app-debug.apk \
            > app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jee-tracker-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256

      - name: Upload Firebase SHA-1
        uses: actions/upload-artifact@v4
        with:
          name: firebase-debug-sha1
          path: firebase-debug-sha1.txt
